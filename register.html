<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FINDRA Register</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#05010b;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:white;

background-image:
radial-gradient(circle at top left,#2c0246 0%,#05010b 45%),
linear-gradient(to bottom,#090012,#05010b);
}

.register-box{
width:100%;
max-width:440px;
background:#12071c;
border:1px solid #4b136d;
border-radius:28px;
padding:34px;
box-shadow:0 0 35px rgba(217,70,239,.22);
}

.logo{
text-align:center;
font-size:38px;
font-weight:900;
margin-bottom:30px;
letter-spacing:-1px;
}

.find{
color:white;
text-shadow:
0 0 10px #fff,
0 0 20px #d946ef,
0 0 40px #d946ef;
}

.ra{
color:#b68ac8;
opacity:.75;
}

.title{
font-size:24px;
font-weight:800;
margin-bottom:8px;
text-align:center;
}

.subtitle{
text-align:center;
font-size:14px;
color:#c4b5fd;
margin-bottom:28px;
line-height:1.5;
}

.input{
width:100%;
height:54px;
padding:0 18px;
margin-bottom:18px;
background:#0b0612;
border:1px solid #4b136d;
border-radius:16px;
outline:none;
color:white;
font-size:14px;
transition:.2s;
}

.input:focus{
border-color:#d946ef;
box-shadow:0 0 16px rgba(217,70,239,.25);
}

.register-btn{
width:100%;
height:54px;
border:none;
border-radius:16px;
background:#a21caf;
color:white;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:.25s;
box-shadow:0 0 20px rgba(217,70,239,.22);
}

.register-btn:hover{
transform:translateY(-2px);
box-shadow:0 0 28px rgba(217,70,239,.35);
}

.switch-text{
margin-top:22px;
text-align:center;
font-size:14px;
color:#c4b5fd;
}

.switch-text span{
color:#f0abfc;
font-weight:700;
cursor:pointer;
}

.error{
margin-top:12px;
font-size:13px;
color:#ff7ac8;
text-align:center;
display:none;
}

</style>
</head>
<body>

<div class="register-box">

<div class="logo">
<span class="find">FIND</span><span class="ra">RA</span>
</div>

<h1 class="title">Create Account</h1>

<p class="subtitle">
Join the FINDRA community and discuss anime, movies, series and cartoons.
</p>

<input
type="text"
class="input"
placeholder="Username"
id="username">

<input
type="email"
class="input"
placeholder="Email"
id="email">

<input
type="password"
class="input"
placeholder="Password"
id="password">

<input
type="password"
class="input"
placeholder="Confirm Password"
id="confirmPassword">

<button class="register-btn" onclick="register()">
Create Account
</button>

<div class="error" id="errorBox"></div>

<p class="switch-text">
Already have an account?
<span onclick="goLogin()">Login</span>
</p>

</div>

<script>

function register(){

const username =
document.getElementById('username').value.trim();

const email =
document.getElementById('email').value.trim();

const password =
document.getElementById('password').value.trim();

const confirmPassword =
document.getElementById('confirmPassword').value.trim();

const errorBox =
document.getElementById('errorBox');

errorBox.style.display='none';

if(
username === '' ||
email === '' ||
password === '' ||
confirmPassword === ''
){
showError('Fill all fields');
return;
}

if(password.length < 4){
showError('Password is too short');
return;
}

if(password !== confirmPassword){
showError('Passwords do not match');
return;
}

const user = {
login:username,
email:email
};

localStorage.setItem(
'findraUser',
JSON.stringify(user)
);

window.location.href='profile.html';

}

function showError(text){

const errorBox =
document.getElementById('errorBox');

errorBox.style.display='block';
errorBox.innerText=text;

}

function goLogin(){
window.location.href='login.html';
}

</script>

</body>
</html>
