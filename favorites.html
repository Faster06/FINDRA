<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINDRA — Favorites</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="favorites.css">      
</head>

<body>

    <div class="container">

        <div id="authContainer"></div>

        <header>
            <div class="left-header" onclick="goHome()">
                <div class="logo-circle">F</div>
                <div class="logo-title">
                    <span class="find">FIND</span><span class="ra">RA</span>
                </div>
            </div>

            <div class="back-btn" onclick="goProfile()">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
        </header>

        <div id="content">
            <section class="section">
                <div class="section-header">
                    <div class="section-title">Favorites</div>
                </div>

                <div class="favorite-grid">
                    <div class="favorite-card" onclick="openPage('solo-leveling')">
                        <img src="sololeveling poster.jpg">
                        <div class="favorite-content">
                            <h3>Solo Leveling</h3>
                            <span>Anime</span>
                        </div>
                    </div>

                    <div class="favorite-card" onclick="openPage('oppenheimer')">
                        <img src="oppenheimer poster.jpg">
                        <div class="favorite-content">
                            <h3>Oppenheimer</h3>
                            <span>Movie</span>
                        </div>
                    </div>

                    <div class="favorite-card" onclick="openPage('the-last-of-us')">
                        <img src="thelastofus poster.jpg">
                        <div class="favorite-content">
                            <h3>The Last of Us</h3>
                            <span>Series</span>
                        </div>
                    </div>

                    <div class="favorite-card" onclick="openPage('spider-verse')">
                        <img src="spiderverse poster.jpg">
                        <div class="favorite-content">
                            <h3>Spider-Verse</h3>
                            <span>Cartoon</span>
                        </div>
                    </div>

                    <div class="favorite-card" onclick="openPage('demon-slayer')">
                        <img src="demonslayer poster.jpg">
                        <div class="favorite-content">
                            <h3>Demon Slayer</h3>
                            <span>Anime</span>
                        </div>
                    </div>

                    <div class="favorite-card" onclick="openPage('breaking-bad')">
                        <img src="breakingbad poster.jpg">
                        <div class="favorite-content">
                            <h3>Breaking Bad</h3>
                            <span>Series</span>
                        </div>
                    </div>
                    <div class="favorite-card" onclick="openPage('detective-conan')">
                        <img src="detectiveconan poster.jpg">
                        <div class="favorite-content">
                            <h3>Detective Conan</h3>
                            <span>Anime</span>
                        </div>
                    </div>
                </div>
            </section>
        </div>

    </div>
    <script src="favorites.js"></script>
</body>

</html>
