<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINDRA — Discussions</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#05010b;
color:white;
padding:18px;
background-image:
radial-gradient(circle at top left,#2c0246 0%,#05010b 45%),
linear-gradient(to bottom,#090012,#05010b);
}

.container{
max-width:1280px;
margin:auto;
}

header{
display:flex;
align-items:center;
justify-content:space-between;
gap:18px;
margin-bottom:24px;
}

.left-header{
display:flex;
align-items:center;
gap:14px;
cursor:pointer;
}

.logo-circle{
width:54px;
height:54px;
border-radius:50%;
background:linear-gradient(135deg,#ff7de7,#a855f7);
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:800;
box-shadow:0 0 20px #d946ef;
}

.logo-title{
font-size:28px;
font-weight:800;
letter-spacing:-1px;
}

.find{
color:#ffffff;
text-shadow:0 0 8px #fff,0 0 20px #d946ef,0 0 40px #d946ef;
}

.ra{
color:#b68ac8;
opacity:0.75;
}

.search-bar{
flex:1;
max-width:720px;
position:relative;
}

.search-bar input{
width:100%;
height:44px;
padding:0 50px 0 18px;
background:#0b0612;
border:1px solid #3f145e;
border-radius:14px;
outline:none;
color:white;
font-size:14px;
}

.search-bar i{
position:absolute;
right:18px;
top:50%;
transform:translateY(-50%);
color:#d8b4fe;
}

.back-btn{
width:42px;
height:42px;
border-radius:12px;
background:#12071c;
border:1px solid #4b136d;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:16px;
color:#f0abfc;
}

.page-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:24px;
}

.page-title{
font-size:30px;
font-weight:800;
}

.start-btn{
padding:12px 18px;
background:#a21caf;
border:none;
border-radius:14px;
color:white;
font-weight:600;
cursor:pointer;
box-shadow:0 0 20px rgba(217,70,239,0.35);
transition:0.3s;
}

.start-btn:hover{
transform:translateY(-2px);
}

.top-filters{
display:flex;
flex-direction:column;
gap:18px;
margin-bottom:24px;
}

.discussion-switch{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.switch-btn{
display:flex;
align-items:center;
gap:10px;
padding:11px 18px;
background:#12071c;
border:1px solid #4b136d;
border-radius:14px;
color:#f3e8ff;
cursor:pointer;
transition:0.3s;
font-size:14px;
font-weight:600;
}

.switch-btn.active,
.switch-btn:hover{
background:#a21caf;
box-shadow:0 0 18px rgba(217,70,239,0.35);
}

.filter-row{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.filter-btn{
padding:10px 16px;
background:#12071c;
border:1px solid #4b136d;
border-radius:12px;
color:#e9d5ff;
font-size:13px;
cursor:pointer;
transition:0.3s;
}

.filter-btn.active,
.filter-btn:hover{
background:#a21caf;
}

.discussions-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.discussion-card{
background:#12071c;
border:1px solid #4b136d;
border-radius:20px;
padding:18px;
transition:0.3s;
cursor:pointer;
}

.discussion-card:hover{
transform:translateY(-4px);
box-shadow:0 0 24px rgba(217,70,239,0.25);
}
.discussion-card{
position:relative;
}

.delete-btn{
position:absolute;
top:14px;
right:14px;
width:38px;
height:38px;
border:none;
border-radius:12px;
background:rgba(239,68,68,.12);
border:1px solid rgba(239,68,68,.25);
color:#f87171;
cursor:pointer;
transition:.25s;
display:flex;
align-items:center;
justify-content:center;
}

.delete-btn:hover{
background:#ef4444;
color:white;
transform:scale(1.05);
}

.discussion-top{
display:flex;
gap:14px;
margin-bottom:18px;
}

.avatar{
width:58px;
height:58px;
border-radius:50%;
background:linear-gradient(135deg,#9333ea,#ec4899);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:700;
flex-shrink:0;
}

.user-info h4{
font-size:15px;
margin-bottom:4px;
}

.user-info span{
font-size:12px;
color:#c4b5fd;
}

.discussion-title{
font-size:18px;
line-height:1.4;
margin-bottom:14px;
}

.discussion-text{
font-size:13px;
line-height:1.6;
color:#d4d4d8;
margin-bottom:18px;
}

.discussion-stats{
display:flex;
gap:18px;
font-size:13px;
color:#f0abfc;
}

@media(max-width:1100px){

.discussions-grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:700px){

header{
flex-direction:column;
align-items:flex-start;
}

.search-bar{
max-width:100%;
width:100%;
}

.page-header{
flex-direction:column;
align-items:flex-start;
gap:14px;
}

.discussions-grid{
grid-template-columns:1fr;
}

}

</style>
</head>
<body>

<div class="container">

<header>

<div class="left-header" onclick="goHome()">
<div class="logo-circle">F</div>

<div class="logo-title">
<span class="find">FIND</span><span class="ra">RA</span>
</div>
</div>

<div class="search-bar">
<input type="text" id="searchInput" placeholder="Search discussions...">
<i class="fa-solid fa-magnifying-glass"></i>
</div>

<div class="back-btn" onclick="goHome()">
<i class="fa-solid fa-arrow-left"></i>
</div>

</header>

<div class="page-header">

<h1 class="page-title">Community Discussions</h1>

<button class="start-btn" onclick="startDiscussion()">
Create Discussion
</button>

</div>

<div class="top-filters">

<div class="discussion-switch">

<div class="switch-btn active" onclick="switchDiscussionType('all-users',event)">
<i class="fa-solid fa-comments"></i>
<span>Discussions</span>
</div>

<div class="switch-btn" onclick="switchDiscussionType('my',event)">
<i class="fa-solid fa-user"></i>
<span>My</span>
</div>

</div>

<div class="filter-row">

<div class="filter-btn active" onclick="filterDiscussions('all',event)">
All
</div>

<div class="filter-btn" onclick="filterDiscussions('anime',event)">
Anime
</div>

<div class="filter-btn" onclick="filterDiscussions('movies',event)">
Movies
</div>

<div class="filter-btn" onclick="filterDiscussions('series',event)">
Series
</div>

<div class="filter-btn" onclick="filterDiscussions('cartoons',event)">
Cartoons
</div>

</div>

</div>

<div class="discussions-grid" id="discussionsGrid">
</div>
<script>

function goHome(){
window.location.href='index.html';
}

function startDiscussion(){
window.location.href='create-discussion.html';
}

function openDiscussion(page){
window.location.href='open-discussion.html?name=' + page;
}

let currentDiscussionType = 'all-users';
let currentCategory = 'all';

function switchDiscussionType(type,event){

currentDiscussionType = type;

const switchButtons =
document.querySelectorAll('.switch-btn');

switchButtons.forEach(btn=>{
btn.classList.remove('active');
});

event.currentTarget.classList.add('active');

updateDiscussions();
}

function filterDiscussions(category,event){

currentCategory = category;

const buttons =
document.querySelectorAll('.filter-btn');

buttons.forEach(btn=>{
btn.classList.remove('active');
});

event.currentTarget.classList.add('active');

updateDiscussions();
}

function updateDiscussions(){

const cards =
document.querySelectorAll('.discussion-card');

const searchValue =
document.getElementById('searchInput')
.value
.toLowerCase();

cards.forEach(card=>{

const text =
card.innerText.toLowerCase();

const isMine =
card.classList.contains('mine');

const categoryMatch =
currentCategory === 'all'
|| card.classList.contains(currentCategory);

let userMatch = true;

if(currentDiscussionType === 'my'){
userMatch = isMine;
}

const searchMatch =
text.includes(searchValue);

if(categoryMatch && userMatch && searchMatch){

card.style.display = 'block';

}else{

card.style.display = 'none';

}

});

}

const searchInput =
document.getElementById('searchInput');

searchInput.addEventListener('input',updateDiscussions);


     loadDiscussions();

function loadDiscussions(){

const grid =
document.getElementById('discussionsGrid');

const savedDiscussions =
JSON.parse(localStorage.getItem('findraDiscussions')) || [];

const defaultDiscussions = [

{
title:'What anime completely changed your taste forever?',
category:'anime',
text:'Some anime completely redefine storytelling and animation.',
user:'Alex Mercer',
time:'2 hours ago',
comments:'328',
views:'19K',
type:'public'
},

{
title:'Best movie cinematography you have ever seen?',
category:'movies',
text:'Some movies are visual masterpieces.',
user:'Mia Carter',
time:'5 hours ago',
comments:'214',
views:'12K',
type:'public'
},

{
title:'Which series had the best final season?',
category:'series',
text:'Some shows deliver legendary finales.',
user:'Sophia Lee',
time:'Yesterday',
comments:'189',
views:'8K',
type:'public'
}

];

const allDiscussions = [
...savedDiscussions,
...defaultDiscussions
];

allDiscussions.forEach((discussion,index)=>{

grid.innerHTML += `

<div class="discussion-card ${discussion.category} ${discussion.type}">

${discussion.type === 'mine' ? `
<button class="delete-btn"
onclick="deleteDiscussion(${index})">
<i class="fa-solid fa-trash"></i>
</button>
` : ''}

<div class="discussion-top">

<div class="avatar">
${discussion.user.charAt(0)}
</div>

<div class="user-info">
<h4>${discussion.user}</h4>
<span>${discussion.time}</span>
</div>

</div>

<h2 class="discussion-title">
${discussion.title}
</h2>

<p class="discussion-text">
${discussion.text}
</p>

<div class="discussion-stats">
<span>💬 ${discussion.comments}</span>
<span>👁 ${discussion.views}</span>
</div>

</div>

`;
});

updateDiscussions();

}
     function deleteDiscussion(index){

if(!confirm('Delete discussion?')){
return;
}

let discussions =
JSON.parse(localStorage.getItem('findraDiscussions')) || [];

discussions.splice(index,1);

localStorage.setItem(
'findraDiscussions',
JSON.stringify(discussions)
);

location.reload();

}
  
</script>
</body>
</html>
