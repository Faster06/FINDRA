<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINDRA Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-box">

<div class="logo">
<span class="find">FIND</span><span class="ra">RA</span>
</div>

<input
type="text"
class="input"
placeholder="Login"
id="login">

<input
type="password"
class="input"
placeholder="Password"
id="password">

<button class="login-btn" onclick="login()">
Sign In
</button>

  <p class="switch-text">
Don't have an account?
<span onclick="goRegister()">Create </span>
</p>

</div>

<script>

function login(){

const login =
document.getElementById('login').value;

const password =
document.getElementById('password').value;

if(login === '' || password === ''){
alert('Fill all fields');
return;
}

const user = {
login:login
};

localStorage.setItem(
'findraUser',
JSON.stringify(user)
);

window.location.href='profile.html';

}

  function goRegister(){
window.location.href='register.html';
}

</script>

</body>
</html>
