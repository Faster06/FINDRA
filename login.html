<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FINDRA Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#05010b;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
background-image:
radial-gradient(circle at top left,#2c0246 0%,#05010b 45%);
}

.login-box{
width:420px;
background:#12071c;
border:1px solid #4b136d;
border-radius:24px;
padding:32px;
box-shadow:0 0 30px rgba(217,70,239,.25);
}

.logo{
font-size:34px;
font-weight:900;
margin-bottom:26px;
text-align:center;
}

.find{
color:white;
text-shadow:0 0 10px #fff,0 0 20px #d946ef;
}

.ra{
color:#b68ac8;
opacity:.7;
}

.input{
width:100%;
height:52px;
margin-bottom:18px;
padding:0 18px;
background:#0b0612;
border:1px solid #4b136d;
border-radius:14px;
outline:none;
color:white;
font-size:14px;
}

.login-btn{
width:100%;
height:52px;
border:none;
border-radius:14px;
background:#a21caf;
color:white;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:.2s;
}

.login-btn:hover{
transform:translateY(-2px);
}

</style>
</head>
<body>

<div class="login-box">

<div class="logo">
<span class="find">FIND</span><span class="ra">RA</span>
</div>

<input
type="text"
class="input"
placeholder="Login"
id="login">

<input
type="password"
class="input"
placeholder="Password"
id="password">

<button class="login-btn" onclick="login()">
Sign In
</button>

  <p class="switch-text">
Don't have an account?
<span onclick="goRegister()">Create Account</span>
</p>

</div>

<script>

function login(){

const login =
document.getElementById('login').value;

const password =
document.getElementById('password').value;

if(login === '' || password === ''){
alert('Fill all fields');
return;
}

const user = {
login:login
};

localStorage.setItem(
'findraUser',
JSON.stringify(user)
);

window.location.href='profile.html';

}

  function goRegister(){
window.location.href='register.html';
}

</script>

</body>
</html>
